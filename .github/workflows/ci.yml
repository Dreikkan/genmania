name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Compile
        run: python -m py_compile bot.py

      - name: Tests
        run: python -m pytest -q --cov=. --cov-branch --cov-report=term:skip-covered --cov-fail-under=95

      - name: Ruff critical
        run: ruff check --select F821,F811,F401 bot.py tests gen_mania

      - name: Type check
        run: python -m mypy gen_mania

      - name: Type check bot.py (gradual, non-blocking)
        continue-on-error: true
        run: python -m mypy bot.py --follow-imports=skip --ignore-missing-imports

      - name: Security scan
        run: python -m bandit -q -c bandit.yaml -r gen_mania bot.py -ll

      - name: Dependency audit
        run: python -m pip_audit -r requirements.lock --progress-spinner off
