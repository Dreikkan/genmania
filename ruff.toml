target-version = "py311"
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[lint]
# CI проверяет критичные ошибки; остальные правила можно включать постепенно.
select = ["F821", "F811", "F401"]
ignore = []

[format]
quote-style = "double"
